<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Koreksi Essay MUPA</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
#app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:Arial,sans-serif;color:#555;text-align:center}
.box{padding:20px}.spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #ddd;border-top-color:#1976d2;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="box"><div class="spinner"></div><div>Memuat e-Koreksi Essay MUPA...</div></div></div>

<div id="app">
  <!-- GANTI URL DI BAWAH dengan URL Web App Google Apps Script Anda -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzQmk8bdsZDBUz_hrS_h2qhqrT4IHRUzPbvb2tLjd6ZauMdi922szh03ITYsbAN8woe/exec"
    allow="camera; microphone; clipboard-read; clipboard-write"
    allowfullscreen></iframe>
</div>

<script>
const frame=document.getElementById('appFrame');
const loading=document.getElementById('loading');
frame.addEventListener('load',()=>loading.style.display='none');
</script>
</body>
</html>
